
name: Renovar NATV

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: renovar-natv
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Obtener enlace y actualizar NATV
        shell: bash
        run: |
          set -euo pipefail

          yt-dlp --no-config -f "best[protocol*=m3u8]/best" \
            --get-url \
            "https://www.dailymotion.com/video/x8dhap9" \
            > /tmp/natv-url.txt

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import urllib.request

          url = Path("/tmp/natv-url.txt").read_text().strip()

          parsed = urlsplit(url)
          host = parsed.hostname or ""

          if (
              parsed.scheme != "https"
              or not host.endswith(".dmcdn.net")
              or not parsed.path.endswith(".m3u8")
              or "\n" in url
          ):
              raise SystemExit("ERROR: URL HLS inesperada")

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              contenido = response.read(4096).decode("utf-8-sig")

          if not contenido.startswith("#EXTM3U"):
              raise SystemExit("ERROR: La URL no devuelve una lista HLS")

          lista = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:3\n"
              '#EXT-X-STREAM-INF:BANDWIDTH=3000000,NAME="NATV"\n'
              + url + "\n"
          )

          Path("NATV.m3u8").write_text(
              lista, encoding="utf-8"
          )

          print("NATV.m3u8 generado correctamente")
          print("Servidor:", host)
          print("URL HLS comprobada")
          PY

      - name: Publicar cambios en GitHub
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add NATV.m3u8

          if git diff --cached --quiet; then
            echo "NATV ya esta actualizado"
          else
            git commit -m "Renovar enlaces NATV automaticamente"
            git push
            echo "NATV actualizado correctamente en GitHub"
          fi
